name: Deploy Frontend

on:
  push:
    branches: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Iniciar sesion en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Construir y Subir imagen a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: innovatech-front-despacho
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Desplegar en EC2 via AWS SSM
      uses: aws-actions/aws-ssm-send-command@v1
      with:
        instance-ids: ${{ secrets.EC2_FRONTEND_INSTANCE_ID }}
        document-name: AWS-RunShellScript
        parameters: |
          commands:
            - "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}"
            - "docker pull ${{ steps.login-ecr.outputs.registry }}/innovatech-front-despacho:latest"
            - "mkdir -p /app/frontend && cd /app/frontend"
            - "cat << 'EOF' > docker-compose.yml"
            - "version: '3.8'"
            - "services:"
            - "  front-despacho:"
            - "    container_name: front-despacho"
            - "    image: ${{ steps.login-ecr.outputs.registry }}/innovatech-front-despacho:latest"
            - "    ports:"
            - "      - \"80:80\""
            - "    restart: unless-stopped"
            - "    networks:"
            - "      - innovatech-public-net"
            - "networks:"
            - "  innovatech-public-net:"
            - "    driver: bridge"
            - "EOF"
            - "docker compose down || true"
            - "docker compose up -d"
